<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KFC 抖音素材复核</title><style>:root{--blue:#2166d1;--ink:#17243b;--muted:#66758d;--line:#dfe6f0;--bg:#f5f7fb;--green:#18784a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Arial,"PingFang SC",sans-serif}.shell{max-width:920px;margin:auto;padding:32px 20px 72px}h1{font-size:30px;margin:0 0 5px}.sub,.note{color:var(--muted);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:18px}.card h2{font-size:18px;margin:0 0 7px}.files{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.file{display:block;border:1.5px dashed #aebfdd;border-radius:9px;padding:18px;min-height:130px;cursor:pointer;background:#fbfcff}.file b,.file small{display:block}.file small{margin-top:8px;color:var(--muted);overflow-wrap:anywhere}.file input{display:none}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.fields label{border:1px solid var(--line);border-radius:6px;padding:7px}.status{padding:10px 12px;background:#f1f5ff;color:#42608d;border-radius:7px;margin-top:13px;white-space:pre-wrap}.status.error{background:#fff1f1;color:#a72f2f}.hidden{display:none}button{border:1px solid #cfdaeb;border-radius:7px;background:#fff;color:#33445f;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.55}.success{display:inline-block;margin-top:10px;color:var(--green);font-weight:700}@media(max-width:620px){.files,.fields{grid-template-columns:1fr}}</style></head><body><main class="shell"><h1>KFC 抖音素材复核</h1><p class="sub">以抖音本地 Offer 表为基准，导入抖音后台商品明细后，选择字段进行自动核对。</p><section class="card"><h2>上传两份表格</h2><p class="note">Offer 表应含券ID、产品名、活动价、L3、使用效期和上架时间；后台文件应含商品ID和商家平台券ID。工具只在本地处理文件。</p><div class="files"><label class="file"><b>1. 抖音本地 Offer 表</b><small id="offer-name">包含“券ID”（XLSX）</small><input id="offer" type="file" accept=".xlsx,.xlsm"></label><label class="file"><b>2. 抖音后台商品明细</b><small id="export-name">包含商品ID与“商家平台券ID”（XLSX）</small><input id="douyin-export" type="file" accept=".xlsx,.xlsm"></label></div><h2>选择核对字段</h2><div id="fields" class="fields"></div><button id="run" class="primary">开始核对并生成 Excel</button><div id="status" class="status hidden"></div></section></main><script>const $=id=>document.getElementById(id);function message(text,error=false){const n=$('status');n.textContent=text;n.classList.remove('hidden');n.classList.toggle('error',error)}async function request(path,options={}){const r=await fetch(path,options),raw=await r.text();let body={};try{body=JSON.parse(raw)}catch{throw Error(r.ok?'服务返回了无法识别的数据。':`服务返回错误（${r.status}）：${raw.slice(0,180)}`)}if(!r.ok)throw Error(body.detail||`服务错误（${r.status}）`);return body}async function setup(){const data=await request('/api/fields');$('fields').innerHTML=data.fields.map(f=>`<label><input data-field value="${f}" type="checkbox" checked> ${f}</label>`).join('');for(const [input,label] of [['offer','offer-name'],['douyin-export','export-name']])$(input).onchange=e=>$(label).textContent=e.target.files[0]?.name||'点击选择文件';$('run').onclick=async()=>{try{if(!$('offer').files[0]||!$('douyin-export').files[0])throw Error('请先选择抖音本地 Offer 表和抖音后台商品明细。');const fields=[...document.querySelectorAll('[data-field]:checked')].map(x=>x.value);if(!fields.length)throw Error('请至少选择一个核对字段。');const form=new FormData();form.append('offer',$('offer').files[0]);form.append('douyin_export',$('douyin-export').files[0]);form.append('selected_fields',fields.join(','));$('run').disabled=true;message('正在按券 ID 匹配抖音 Offer 与后台商品明细…');const data=await request('/api/reconcile',{method:'POST',body:form}),t=data.totals;message(`核对完成：通过 ${t['通过']}，待复核 ${t['待复核']}，错误 ${t['错误']}。`);const link=document.createElement('a');link.href=data.download;link.textContent='下载抖音素材复核结果.xlsx';link.className='success';$('status').append(document.createElement('br'),link)}catch(e){message(e.message,true)}finally{$('run').disabled=false}}}setup().catch(e=>message(e.message,true));</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KFC 素材核查助手</title>
  <style>
    :root{--blue:#2166d1;--ink:#17243b;--muted:#66758d;--line:#dfe6f0;--bg:#f5f7fb;--green:#18784a;--amber:#af6800;--red:#bf3434}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Arial,"PingFang SC",sans-serif}
    .shell{max-width:980px;margin:auto;padding:32px 20px 72px} h1{font-size:30px;margin:0 0 5px}.sub,.note{color:var(--muted);margin:0}
    .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:18px}.card h2{font-size:18px;margin:0 0 7px}
    .tabs{display:flex;gap:10px;margin:16px 0}.tab{border:1px solid #cfdaeb;border-radius:8px;background:#fff;color:#33445f;padding:10px 22px;font-weight:700;cursor:pointer}.tab.active{background:#edf4ff;color:var(--blue);border-color:#92b3ee}
    .files{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.file{display:block;border:1.5px dashed #aebfdd;border-radius:9px;padding:18px;min-height:138px;cursor:pointer;background:#fbfcff}.file b,.file small{display:block}.file small{margin-top:8px;color:var(--muted);overflow-wrap:anywhere}.file input{display:none}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.fields label{border:1px solid var(--line);border-radius:6px;padding:7px}.offer-note{margin:4px 0 18px;padding:11px 13px;border-radius:8px;background:#f7faff;border:1px solid #d7e3f8;color:#42608d}
    .status{padding:10px 12px;background:#f1f5ff;color:#42608d;border-radius:7px;margin-top:13px;white-space:pre-wrap}.status.error{background:#fff1f1;color:#a72f2f}.hidden{display:none}
    button{border:1px solid #cfdaeb;border-radius:7px;background:#fff;color:#33445f;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.55;cursor:wait}.success{display:inline-block;margin-top:10px;color:var(--green);font-weight:700}
    .result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.result-head h2{margin-bottom:3px}.download{white-space:nowrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.summary button,.summary-info{padding:13px;text-align:left;border:1px solid var(--line);border-radius:7px;background:#fff}.summary b{display:block;font-size:23px}.summary small{color:var(--muted)}.summary .active{border-color:var(--blue);box-shadow:0 0 0 2px #e5efff}.pass{color:var(--green)}.review{color:var(--amber)}.fail{color:var(--red)}
    .result-controls{display:grid;grid-template-columns:minmax(240px,1fr) auto auto;gap:9px;align-items:center;padding:12px;background:#f7f9fd;border:1px solid var(--line);border-radius:9px;margin-bottom:12px}.result-search{min-width:0;width:100%;border:1px solid #cbd7e8;border-radius:7px;background:#fff;color:var(--ink);font:inherit;padding:9px 11px}.search-button{padding:9px 14px}.filter-group{display:flex;gap:6px;align-items:center}.filter-group button{padding:8px 10px;font-size:12px}.filter-group button.active{color:var(--blue);border-color:#92b3ee;background:#edf4ff}.filter-group button.high.active{color:#a72f2f;border-color:#e6a8a8;background:#fff0f0}.filter-group button.low.active{color:#8b5a00;border-color:#eacb8d;background:#fff8e9}.risk-detail-filter{min-width:185px;border:1px solid #cbd7e8;border-radius:7px;background:#fff;color:var(--ink);font:inherit;padding:8px 9px}
    .result-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.result-table{width:100%;min-width:830px;border-collapse:collapse}.result-table th{text-align:left;background:#f7f9fd;color:var(--muted);font-size:12px;padding:10px}.result-table td{border-top:1px solid var(--line);padding:11px;vertical-align:top}.badge{display:inline-block;padding:2px 7px;border-radius:12px;font-size:12px;font-weight:700;background:#eef2f7;color:#526077;margin:0 4px 4px 0}.badge.pass{background:#edf8f1}.badge.review{background:#fff7e7}.badge.fail{background:#fff0f0}.issue-list{display:grid;gap:6px;min-width:150px}.issue{display:flex;align-items:center;gap:5px;line-height:1.35}.issue-name{font-weight:700;word-break:break-word}.issue-values{margin:2px 0 0 22px;color:#5d6d85;font-size:12px;line-height:1.6;word-break:break-word;white-space:pre-wrap}.text-diff{padding:0 2px;border-radius:2px;background:#ffe2e2;color:#a72f2f;text-decoration:none}.risk-tag{flex:none;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:800}.risk-tag.high{background:#ffe5e5;color:#b22f2f}.risk-tag.low{background:#fff2d7;color:#976000}.no-issue{color:var(--muted);font-size:12px}.detail{min-width:190px;color:#526a96}.detail summary{cursor:pointer;font-weight:700;color:var(--blue)}.detail-content{margin-top:9px;padding:9px 10px;border-radius:6px;background:#f8faff;color:#59667a;font-size:12px;white-space:pre-wrap;word-break:break-word}.detail-check{padding:7px 0;border-top:1px solid #e4eaf4}.detail-check:first-child{padding-top:0;border-top:0}.reason{margin-top:8px;padding-top:8px;border-top:1px solid #e4eaf4}.empty{padding:28px;text-align:center;color:var(--muted)}
    @media(max-width:780px){.summary{grid-template-columns:repeat(2,1fr)}.result-controls{grid-template-columns:1fr}.filter-group{flex-wrap:wrap}}@media(max-width:620px){.files,.fields{grid-template-columns:1fr}.result-head{display:block}.download{margin-top:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <h1>KFC 素材核查助手</h1>
    <p class="sub">在一个页面完成抖音或美团素材核查；平台切换不会改变各自原有的核对规则。</p>
    <section class="card">
      <h2>1. 选择核查平台</h2>
      <div class="tabs" id="platforms"></div>
      <p class="note" id="platform-note"></p>
    </section>
    <section class="card">
      <h2>2. 上传两份表格</h2>
      <div class="files">
        <label class="file"><b id="source-label"></b><small id="source-name"></small><input id="source" type="file" accept=".xlsx,.xlsm"></label>
        <label class="file"><b id="export-label"></b><small id="export-name"></small><input id="platform-export" type="file" accept=".xlsx,.xlsm"></label>
      </div>
      <p class="offer-note" id="offer-note">抖音核对会自动扫描所有有效 Offer 工作表；同券 ID 在多页重复时，会根据商品名称、活动价、L3 等字段尝试唯一确认，无法确认的记录会标为待复核。</p>
      <h2>3. 选择核对字段</h2>
      <div id="fields" class="fields"></div>
      <button id="run" class="primary">开始核对并生成 Excel</button>
      <div id="status" class="status hidden"></div>
    </section>
    <section class="card hidden" id="results">
      <div class="result-head"><div><h2>4. 核对结果</h2><p class="note" id="result-note"></p></div><a class="success download" id="download" href="#">下载完整 Excel 结果</a></div>
      <div class="summary" id="summary"></div>
      <div class="result-controls">
        <input class="result-search" id="result-search" type="search" placeholder="搜索券 ID、商品 ID、字段名称或核对值" aria-label="搜索核对结果">
        <button class="primary search-button" id="result-search-button" type="button">搜索</button>
        <div class="filter-group" aria-label="按风险等级筛选"><button data-risk="全部" class="active">全部风险</button><button data-risk="高风险" class="high">高风险</button><button data-risk="低风险" class="low">低风险</button><select class="risk-detail-filter hidden" id="risk-detail-filter" aria-label="按风险字段筛选" disabled></select></div>
      </div>
      <div class="result-table-wrap"><table class="result-table"><thead><tr><th>券 ID</th><th>商品 ID</th><th>整券结果</th><th>高风险问题</th><th>低风险问题</th><th>查看异常对照</th></tr></thead><tbody id="result-rows"></tbody></table></div>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id); let platforms={},platform='meituan',latestResults=null,activeFilter='全部',activeRisk='全部',activeRiskCheck='',searchTerm='';
    function message(text,error=false){const node=$('status');node.textContent=text;node.classList.remove('hidden');node.classList.toggle('error',error)}
    function clearMessage(){const node=$('status');node.textContent='';node.classList.add('hidden');node.classList.remove('error')}
    async function request(path,options={}){const response=await fetch(path,options);const raw=await response.text();let body={};try{body=JSON.parse(raw)}catch{throw Error(response.ok?'服务返回了无法识别的数据。':`服务返回错误（${response.status}）：${raw.slice(0,180)}`)}if(!response.ok)throw Error(body.detail||`服务错误（${response.status}）`);return body}
    function selectedFields(){return [...document.querySelectorAll('[data-field]:checked')].map(node=>node.value)}
    function escapeHtml(value){return String(value??'').replace(/[&<>"\x27]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function statusClass(status){return status==='通过'?'pass':status==='待复核'?'review':'fail'}
    function resetResults(){latestResults=null;activeFilter='全部';activeRisk='全部';activeRiskCheck='';searchTerm='';clearMessage();$('results').classList.add('hidden');$('summary').innerHTML='';$('result-rows').innerHTML='';$('result-note').textContent='';$('result-search').value='';$('risk-detail-filter').innerHTML='';$('risk-detail-filter').disabled=true;$('risk-detail-filter').classList.add('hidden');document.querySelectorAll('[data-risk]').forEach(button=>button.classList.toggle('active',button.dataset.risk==='全部'));$('download').removeAttribute('href');$('download').removeAttribute('download')}
    function riskLevel(field){return /券\s*ID|平台券|售卖|上架|下架|开始|结束|使用.*(?:时间|时段)|有效期|价格|售价|原价|划线价|美团价|金额|价/.test(field)?'高风险':'低风险'}
    function exceptionChecks(row){const checks=row.checks.filter(check=>check.status!=='通过');return checks.length||row.overall==='通过'?checks:[{field:'整券核查',status:row.overall,local_value:'',backend_value:'',fallback:true}]}
    function checksByRisk(row,risk){return exceptionChecks(row).filter(check=>riskLevel(check.field)===risk)}
    function riskCheckKey(check){return check.field}
    function riskCheckMatches(row){return !activeRiskCheck||exceptionChecks(row).some(check=>riskCheckKey(check)===activeRiskCheck)}
    function renderRiskCheckFilter(){const select=$('risk-detail-filter');if(activeRisk==='全部'){activeRiskCheck='';select.innerHTML='';select.disabled=true;select.classList.add('hidden');return}const options=[...new Map(latestResults.rows.flatMap(row=>checksByRisk(row,activeRisk).map(check=>[riskCheckKey(check),check]))).entries()];if(!options.some(([key])=>key===activeRiskCheck))activeRiskCheck='';select.innerHTML=`<option value="">全部${activeRisk}字段</option>${options.map(([key,check])=>`<option value="${escapeHtml(key)}">${escapeHtml(check.field)}</option>`).join('')}`;select.value=activeRiskCheck;select.disabled=false;select.classList.remove('hidden')}
    function searchMatches(row){const needle=searchTerm.trim().toLocaleLowerCase();if(!needle)return true;return [row.coupon_id,row.platform_id,row.reason,...row.checks.flatMap(check=>[check.field,check.local_value,check.backend_value,check.status])].some(value=>String(value??'').toLocaleLowerCase().includes(needle))}
    function diffKey(value){const key=String(value??'').toLocaleLowerCase().replace(/风味/g,'').replace(/美团/g,'').replace(/原味冰淇淋原味花筒/g,'原味冰淇淋花筒').replace(/[\s，,、/／；;。.!！?？:：()（）\[\]【】'"“”‘’]/g,'');return /^\d+$/.test(key)?'':key}
    function diffPart(value){const key=diffKey(value),unit=key.match(/^\d+(?:份|杯|块|个|盒|瓶|串)/);return {key,hasUnit:Boolean(unit),withoutUnit:unit?key.slice(unit[0].length):key}}
    function differenceMarkup(value,other,enabled=false){const raw=String(value??'');if(!enabled||!raw)return escapeHtml(raw)||'—';const otherParts=String(other??'').split(/([，,、/／；;。.!！?？:：\n]+)/).map(diffPart).filter(part=>part.key);return raw.split(/([，,、/／；;。.!！?？:：\n]+)/).map(part=>{const current=diffPart(part),matched=otherParts.some(candidate=>candidate.key===current.key||((candidate.hasUnit!==current.hasUnit)&&candidate.withoutUnit===current.withoutUnit)||(current.key.length>=4&&(candidate.key.includes(current.key)||current.key.includes(candidate.key))));return !current.key||matched?escapeHtml(part):`<mark class="text-diff">${escapeHtml(part)}</mark>`}).join('')}
    function comparisonValuesMarkup(check,labels){const highlight=check.status==='不通过'&&['菜品备注','其他规则补充说明'].includes(check.field);return `${labels[0]}：${differenceMarkup(check.backend_value,check.local_value,highlight)}<br>${labels[1]}：${differenceMarkup(check.local_value,check.backend_value,highlight)}`}
    function issueMarkup(check,risk,labels,showValues=false){return `<div><div class="issue"><span class="risk-tag ${risk==='高风险'?'high':'low'}">${risk==='高风险'?'!':'i'}</span><span class="issue-name">${escapeHtml(check.field)}</span><span class="badge ${statusClass(check.status)}">${escapeHtml(check.status)}</span></div>${showValues&&!check.fallback?`<div class="issue-values">${comparisonValuesMarkup(check,labels)}</div>`:''}</div>`}
    function detailMarkup(row,labels,checks=exceptionChecks(row)){return `<details class="detail"><summary>查看 ${checks.length} 项异常对照</summary><div class="detail-content">${checks.map(check=>`<div class="detail-check"><b>${escapeHtml(check.field)} · ${escapeHtml(check.status)}</b>${check.fallback?'':`<br>${comparisonValuesMarkup(check,labels)}`}</div>`).join('')}${row.reason?`<div class="reason"><b>${platform==='meituan'?'核对说明':'异常原因'}：</b>${escapeHtml(row.reason)}</div>`:''}</div></details>`}
    function visibleRiskChecks(row,risk){const checks=checksByRisk(row,risk);return activeRiskCheck?checks.filter(check=>riskCheckKey(check)===activeRiskCheck):checks}
    function renderResults(){if(!latestResults)return;const labels=platform==='meituan'?['美团后台','KFC总表']:['抖音后台表格','业务本地表格'];renderRiskCheckFilter();const rows=latestResults.rows.filter(row=>(activeFilter==='全部'||row.overall===activeFilter)&&searchMatches(row)&&(activeRisk==='全部'||checksByRisk(row,activeRisk).length)&&riskCheckMatches(row));$('summary').innerHTML=['通过','待复核','不通过'].map(status=>`<button data-filter="${status}" class="${activeFilter===status?'active':''}"><b class="${statusClass(status)}">${latestResults.totals[status]}</b><small>${status}</small></button>`).join('');$('summary').insertAdjacentHTML('afterbegin',`<button data-filter="全部" class="${activeFilter==='全部'?'active':''}"><b>${latestResults.rows.length}</b><small>全部券 ID</small></button>`);$('summary').querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{activeFilter=button.dataset.filter;renderResults()});document.querySelectorAll('[data-risk]').forEach(button=>button.classList.toggle('active',button.dataset.risk===activeRisk));$('result-rows').innerHTML=rows.length?rows.map(row=>{const high=activeRisk==='低风险'?[]:visibleRiskChecks(row,'高风险'),low=activeRisk==='高风险'?[]:visibleRiskChecks(row,'低风险'),details=activeRisk==='全部'?exceptionChecks(row):activeRisk==='高风险'?high:low;return `<tr><td>${escapeHtml(row.coupon_id)}</td><td>${escapeHtml(row.platform_id)||'—'}</td><td><span class="badge ${statusClass(row.overall)}">${escapeHtml(row.overall)}</span></td><td>${high.length?`<div class="issue-list">${high.map(check=>issueMarkup(check,'高风险',labels,activeRisk==='高风险')).join('')}</div>`:'<span class="no-issue">无</span>'}</td><td>${low.length?`<div class="issue-list">${low.map(check=>issueMarkup(check,'低风险',labels,activeRisk==='低风险')).join('')}</div>`:'<span class="no-issue">无</span>'}</td><td>${details.length?detailMarkup(row,labels,details):'<span class="no-issue">通过</span>'}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">当前筛选条件下没有记录。</td></tr>'}
    function resetFiles(){for(const id of ['source','platform-export'])$(id).value='';$('source-name').textContent=platforms[platform].source_hint;$('export-name').textContent=platforms[platform].export_hint}
    async function render(){const config=platforms[platform];resetResults();document.querySelectorAll('[data-platform]').forEach(node=>node.classList.toggle('active',node.dataset.platform===platform));$('platform-note').textContent=`已选择${config.label}：请上传 ${config.source_label} 和 ${config.export_label}。`;$('source-label').textContent=`1. ${config.source_label}`;$('export-label').textContent=`2. ${config.export_label}`;$('offer-note').classList.toggle('hidden',platform!=='douyin');if(platform==='douyin')$('offer-note').textContent='抖音以商家平台券ID作为唯一匹配键；核对范围仅包含商品名称、售价、商品总价（划线价）、售卖开始/结束时间和商品类型。同券的多个商品ID会合并展示。';resetFiles();const data=await request(`/api/platforms/${platform}/fields`);const defaults=new Set(data.default_fields||data.fields);$('fields').innerHTML=data.fields.map(field=>`<label><input data-field value="${field}" type="checkbox" ${defaults.has(field)?'checked':''}> ${field}</label>`).join('')}
    async function setup(){platforms=await request('/api/platforms');$('platforms').innerHTML=['meituan','douyin'].filter(key=>platforms[key]).map(key=>`<button class="tab" data-platform="${key}">${platforms[key].label}</button>`).join('');document.querySelectorAll('[data-platform]').forEach(node=>node.onclick=()=>{platform=node.dataset.platform;render().catch(error=>message(error.message,true))});$('source').onchange=event=>$('source-name').textContent=event.target.files[0]?.name||platforms[platform].source_hint;$('platform-export').onchange=event=>$('export-name').textContent=event.target.files[0]?.name||platforms[platform].export_hint;$('result-search-button').onclick=()=>{searchTerm=$('result-search').value;renderResults()};$('result-search').oninput=event=>{if(!event.target.value.trim()){searchTerm='';renderResults()}};$('result-search').onkeydown=event=>{if(event.key==='Enter')$('result-search-button').click()};$('risk-detail-filter').onchange=event=>{activeRiskCheck=event.target.value;renderResults()};document.querySelectorAll('[data-risk]').forEach(button=>button.onclick=()=>{activeRisk=button.dataset.risk;activeRiskCheck='';renderResults()});$('run').onclick=run;await render()}
    async function run(){try{if(!$('source').files[0]||!$('platform-export').files[0])throw Error('请先选择两份待核查表格。');const fields=selectedFields();if(!fields.length)throw Error('请至少选择一个核对字段。');const form=new FormData();form.append('platform',platform);form.append('source',$('source').files[0]);form.append('platform_export',$('platform-export').files[0]);form.append('selected_fields',fields.join(','));$('run').disabled=true;message(`正在按${platforms[platform].label}原有规则匹配券 ID 并生成结果…`);const data=await request('/api/reconcile',{method:'POST',body:form});latestResults=data.page_results;activeFilter='全部';activeRisk='全部';activeRiskCheck='';searchTerm='';$('result-search').value='';$('result-note').textContent=`已完成 ${latestResults.rows.length} 个券 ID 的核对。仅直接展示异常字段；两侧原始值可在“查看异常对照”中按需展开，完整结果请下载 Excel。`;$('download').href=data.download;$('download').download=data.filename;$('results').classList.remove('hidden');renderResults();const totals=Object.entries(latestResults.totals).map(([key,value])=>`${key} ${value}`).join('，');message(`核对完成：${totals}。`);$('results').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){message(error.message,true)}finally{$('run').disabled=false}}
    setup().catch(error=>message(error.message,true));
  </script>
</body>
</html>
